<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VOID DEPT.</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #111;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* NAVIGATION */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 22px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            mix-blend-mode: difference;
            color: white;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 28px;
            font-size: 12px;
            text-transform: uppercase;
        }

        /* HERO */

        .hero {
            height: 100vh;
            min-height: 650px;
            position: relative;
            overflow: hidden;
            background: #111;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
        }

        .hero-content {
            position: absolute;
            bottom: 35px;
            left: 30px;
            color: white;
        }

        .hero-content p {
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .hero-content h1 {
            font-size: clamp(60px, 12vw, 180px);
            line-height: 0.8;
            letter-spacing: -7px;
            font-weight: 700;
        }

        /* COLLECTION */

        .collection {
            padding: 100px 30px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 40px;
        }

        .section-title h2 {
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .section-title span {
            font-size: 11px;
            color: #777;
        }

        /* PRODUCTS */

        .products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .product {
            position: relative;
            cursor: pointer;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 4 / 5;
            background: #eee;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product:hover img {
            transform: scale(1.03);
        }

        .product-info {
            display: flex;
            justify-content: space-between;
            padding: 12px 2px 30px;
            font-size: 11px;
            text-transform: uppercase;
        }

        /* LOOKBOOK */

        .lookbook {
            height: 90vh;
            position: relative;
            overflow: hidden;
            background: #111;
        }

        .lookbook img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lookbook-text {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: white;
        }

        .lookbook-text p {
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .lookbook-text h2 {
            font-size: clamp(50px, 9vw, 130px);
            letter-spacing: -5px;
            line-height: 0.85;
        }

        /* FOOTER */

        footer {
            padding: 70px 30px 30px;
            background: #111;
            color: white;
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 120px;
        }

        .footer-logo {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -2px;
        }

        .footer-links {
            display: flex;
            gap: 80px;
        }

        .footer-links div {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 11px;
            text-transform: uppercase;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #777;
            text-transform: uppercase;
        }

        /* MOBILE */

        @media (max-width: 700px) {
            header {
                padding: 18px;
            }

            nav {
                gap: 12px;
            }

            .hero-content {
                left: 18px;
                bottom: 25px;
            }

            .hero-content h1 {
                letter-spacing: -4px;
            }

            .collection {
                padding: 70px 18px;
            }

            .products {
                grid-template-columns: 1fr;
            }

            .lookbook-text {
                left: 18px;
            }

            .footer-top {
                flex-direction: column;
                gap: 60px;
            }

            .footer-links {
                gap: 40px;
            }

            footer {
                padding: 60px 18px 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="#" class="logo">VOID DEPT.</a>

    <nav>
        <a href="#">Shop</a>
        <a href="#">Archive</a>
        <a href="#">About</a>
        <a href="#">Cart (0)</a>
    </nav>
</header>


<!-- HERO -->

<section class="hero">

    <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=2000&q=90">

    <div class="hero-content">
        <p>Collection 001 — 2026</p>
        <h1>VOID</h1>
    </div>

</section>


<!-- PRODUCTS -->

<section class="collection">

    <div class="section-title">
        <h2>Collection 001</h2>
        <span>04 Pieces</span>
    </div>

    <div class="products">

        <a href="#" class="product">
            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=1200&q=90">
            </div>

            <div class="product-info">
                <span>VOID Denim 001</span>
                <span>$180</span>
            </div>
        </a>


        <a href="#" class="product">
            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=1200&q=90">
            </div>

            <div class="product-info">
                <span>VOID Tee 001</span>
                <span>$85</span>
            </div>
        </a>


        <a href="#" class="product">
            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=1200&q=90">
            </div>

            <div class="product-info">
                <span>VOID Jacket 001</span>
                <span>$240</span>
            </div>
        </a>


        <a href="#" class="product">
            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=1200&q=90">
            </div>

            <div class="product-info">
                <span>VOID Denim 002</span>
                <span>$195</span>
            </div>
        </a>

    </div>

</section>


<!-- LOOKBOOK -->

<section class="lookbook">

    <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=2000&q=90">

    <div class="lookbook-text">
        <p>VOID DEPT. — ARCHIVE</p>
        <h2>001</h2>
    </div>

</section>


<!-- FOOTER -->

<footer>

    <div class="footer-top">

        <div class="footer-logo">
            VOID DEPT.
        </div>

        <div class="footer-links">

            <div>
                <a href="#">Shop</a>
                <a href="#">Archive</a>
                <a href="#">About</a>
            </div>

            <div>
                <a href="#">Instagram</a>
                <a href="#">Contact</a>
                <a href="#">Shipping</a>
            </div>

        </div>

    </div>

    <div class="footer-bottom">
        <span>© 2026 VOID DEPT.</span>
        <span>All Rights Reserved</span>
    </div>

</footer>

</body>
</html>
